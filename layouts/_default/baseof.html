<!doctype html>
<html lang="{{ .Site.Language.Locale | default "zh-cn" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="preload" as="image" href="{{ "images/hero-workspace.png" | relURL }}">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} home">
        <span class="brand-mark">JX</span>
        <span class="brand-name">{{ .Site.Title }}</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
      <p>© {{ now.Format "2006" }} {{ .Site.Params.author }}. Built with Hugo and GitHub Pages.</p>
      <a href="{{ .Site.Params.github }}">GitHub</a>
    </footer>
  </body>
</html>
