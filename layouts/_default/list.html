{{ define "main" }}
  <section class="page">
    <header class="page-header">
      <p class="eyebrow">Writing</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </header>

    <div class="post-list">
      {{ range .Pages }}
        <a class="post-row" href="{{ .RelPermalink }}">
          <div>
            <h2>{{ .Title }}</h2>
            {{ with .Description }}<p>{{ . }}</p>{{ end }}
          </div>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
        </a>
      {{ else }}
        <p>文章正在整理中。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
